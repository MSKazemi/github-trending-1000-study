name: Retire verified merged branches

# One-time main-only, explicit allowlist. Never run from untrusted PRs.
on:
  push:
    branches: [main]
    paths:
      - 'ops/branch-retirement/approved-merged-pr-branches-2026-10-13.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-verified-merged-branches
  cancel-in-progress: false

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fail-closed offline retirement tests
        run: python -m unittest tests.test_retire_merged_branches -v
      - name: Validate explicit approved allowlist (offline)
        run: python scripts/retire_merged_branches.py --plan ops/branch-retirement/approved-merged-pr-branches-2026-10-13.json
      - name: Archive exact SHA then retire verified merged branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/retire_merged_branches.py --plan ops/branch-retirement/approved-merged-pr-branches-2026-10-13.json --execute
