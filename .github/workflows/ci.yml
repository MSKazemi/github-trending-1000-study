# Offline-only CI. Passing checks confirm engineering syntax/test behavior,
# not consent, source access, independent review or scientifically valid findings.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official tag 2026-10-13
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified official tag 2026-10-13
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source
        run: python -m compileall -q trending_study scripts tests
      - name: Run offline unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify research CLI entrypoints
        run: |
          python -m trending_study --help > /dev/null
          python -m trending_study.reuse_gate --help > /dev/null
          python -m trending_study.goldset --help > /dev/null

  research-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate canonical JSON JSONL CSV research evidence
        run: python -m trending_study.data_integrity --root .
      - name: Reject malformed, duplicate-key and nonstandard research artifacts
        run: python scripts/check_research_artifacts.py --root .
