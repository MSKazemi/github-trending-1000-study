name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Always keep post-merge main CI; cancel only obsolete PR revisions.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout verified immutable action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python verified immutable action
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source and tests
        run: python -m compileall -q trending_study tests
      - name: Validate research JSON and JSONL evidence (syntax and unambiguous numbers)
        run: python -m trending_study.data_integrity --root .
      - name: Offline research regression tests
        run: python -m unittest discover -s tests -v
      - name: Research CLI entrypoints
        run: |
          python -m trending_study --help > /dev/null
          python -m trending_study.reuse_gate --help > /dev/null
          python -m trending_study.goldset --help > /dev/null
