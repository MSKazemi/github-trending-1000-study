name: Manual verified merged-branch retirement

# Manual-only. No branch is retired on push, PR merge or a schedule.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit first; retire only after reviewing all 60 merged-PR heads"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - retire
      confirmation:
        description: "For retire only, type RETIRE_VERIFIED_MERGED_BRANCHES exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: manual-merged-branch-retirement
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check safety tests before read-only audit
        run: python -m unittest tests.test_branch_retirement -v
      - name: Live merged-PR/head-SHA/ancestry verification (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/retire_merged_branches.py \
            --manifest research-notes/branch-retirement-2026-10-13.json --mode audit

  retire:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'retire' && inputs.confirmation == 'RETIRE_VERIFIED_MERGED_BRANCHES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test retirement and archive guards offline
        run: python -m unittest tests.test_branch_retirement -v
      - name: Preflight then archive every head and retire verified refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETIRE_CONFIRM: ${{ inputs.confirmation }}
        run: |
          python scripts/retire_merged_branches.py \
            --manifest research-notes/branch-retirement-2026-10-13.json \
            --mode retire --confirmation "$RETIRE_CONFIRM"
